services:
  - type: web
    name: callers-cockpit-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LLM_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: FRONTEND_ORIGIN
        sync: false
