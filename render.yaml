services:
  - type: web
    name: callers-cockpit-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LLM_KEY
        sync: false
      - key: LLM_MODEL
        value: ministral-8b-2512
      - key: FRONTEND_ORIGIN
        sync: false
